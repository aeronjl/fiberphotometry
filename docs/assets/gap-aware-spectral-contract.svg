<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Gap-aware spectral analysis contract</title>
  <desc id="desc">A signal is partitioned at missing data and state boundaries. Spectral windows remain inside each partition.</desc>
  <defs>
    <linearGradient id="signal" x1="0" x2="1">
      <stop offset="0" stop-color="#6d4aff"/>
      <stop offset="1" stop-color="#10a7a0"/>
    </linearGradient>
    <style>
      .label{font:600 17px ui-sans-serif,system-ui,sans-serif;fill:#28243d}
      .small{font:500 14px ui-sans-serif,system-ui,sans-serif;fill:#625e73}
      .axis{stroke:#c8c3d6;stroke-width:2}
      .boundary{stroke:#e05858;stroke-width:2;stroke-dasharray:7 7}
      .window{fill:#6d4aff;fill-opacity:.12;stroke:#6d4aff;stroke-width:2;rx:8}
      .stateA{fill:#e8e2ff}.stateB{fill:#d9f5f1}.gap{fill:#fde5e5}
    </style>
  </defs>
  <rect width="1120" height="430" rx="20" fill="#fbfaff"/>
  <text x="55" y="48" class="label">1. Preserve the clock and split continuity</text>
  <line x1="65" y1="145" x2="1055" y2="145" class="axis"/>
  <path d="M70 137 C95 72,120 205,145 137 S195 69,220 137 S270 205,295 137 S345 69,370 137 S420 205,445 137" fill="none" stroke="url(#signal)" stroke-width="4"/>
  <rect x="455" y="75" width="105" height="115" class="gap" rx="10"/>
  <text x="472" y="132" class="label">gap</text>
  <path d="M570 137 C595 72,620 205,645 137 S695 69,720 137 S770 205,795 137 S845 69,870 137 S920 205,945 137 S995 69,1020 137" fill="none" stroke="url(#signal)" stroke-width="4"/>
  <line x1="455" y1="65" x2="455" y2="205" class="boundary"/>
  <line x1="560" y1="65" x2="560" y2="205" class="boundary"/>
  <text x="72" y="180" class="small">valid run 0</text>
  <text x="575" y="180" class="small">valid run 1</text>

  <text x="55" y="250" class="label">2. Add user-supplied state boundaries</text>
  <rect x="65" y="275" width="310" height="50" class="stateA" rx="9"/>
  <rect x="375" y="275" width="265" height="50" class="stateB" rx="9"/>
  <rect x="640" y="275" width="415" height="50" class="stateA" rx="9"/>
  <text x="80" y="306" class="small">exploration · epoch 1</text>
  <text x="390" y="306" class="small">rest · epoch 2</text>
  <text x="655" y="306" class="small">exploration · epoch 3</text>
  <line x1="375" y1="264" x2="375" y2="338" class="boundary"/>
  <line x1="640" y1="264" x2="640" y2="338" class="boundary"/>

  <text x="55" y="375" class="label">3. Emit complete windows only</text>
  <rect x="285" y="350" width="80" height="44" class="window"/>
  <rect x="385" y="350" width="80" height="44" class="window"/>
  <rect x="480" y="350" width="80" height="44" class="window"/>
  <rect x="650" y="350" width="80" height="44" class="window"/>
  <rect x="745" y="350" width="80" height="44" class="window"/>
  <rect x="840" y="350" width="80" height="44" class="window"/>
  <text x="945" y="378" class="small">no padding · no bridges</text>
</svg>
