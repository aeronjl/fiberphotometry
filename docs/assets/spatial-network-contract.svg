<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Coordinate-aware dense multi-fiber evidence contract</title>
  <desc id="desc">Four mapped fibers create six gap-aware pairwise edges. Edge values are summarized by distance and tested with a coordinate-label null. Edges become session values, repeated sessions become one mouse value, and mice are contrasted across conditions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f8f5ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17233b" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60708a"/>
    </marker>
    <style>
      .title { font: 700 30px ui-sans-serif, system-ui, sans-serif; fill: #17233b; }
      .step { font: 700 18px ui-sans-serif, system-ui, sans-serif; fill: #1c2d4d; }
      .label { font: 600 14px ui-sans-serif, system-ui, sans-serif; fill: #31425f; }
      .small { font: 500 12px ui-sans-serif, system-ui, sans-serif; fill: #60708a; }
      .tiny { font: 600 11px ui-monospace, SFMono-Regular, monospace; fill: #495a75; }
      .card { fill: url(#card); stroke: #dbe3ef; stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .arrow { fill: none; stroke: #60708a; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-hot { stroke: #6c4fd3; stroke-width: 7; stroke-linecap: round; opacity: .88; }
      .edge-cool { stroke: #92a2b8; stroke-width: 3; stroke-linecap: round; opacity: .65; }
      .node { fill: #ffffff; stroke: #263b64; stroke-width: 4; }
    </style>
  </defs>

  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <text x="56" y="58" class="title">Dense arrays: geometry → edges → sessions → mice</text>
  <text x="56" y="87" class="small">One evidence path; three different denominators that must not be confused</text>

  <rect x="48" y="124" width="292" height="490" class="card"/>
  <text x="72" y="160" class="step">1 · Declare geometry</text>
  <text x="72" y="184" class="small">shared space + shared unit + shared clock</text>

  <path d="M 120 278 L 262 248" class="edge-hot"/>
  <path d="M 120 278 L 145 442" class="edge-cool"/>
  <path d="M 120 278 L 280 466" class="edge-cool"/>
  <path d="M 262 248 L 145 442" class="edge-cool"/>
  <path d="M 262 248 L 280 466" class="edge-cool"/>
  <path d="M 145 442 L 280 466" class="edge-hot"/>
  <circle cx="120" cy="278" r="20" class="node"/><text x="113" y="283" class="label">A</text>
  <circle cx="262" cy="248" r="20" class="node"/><text x="255" y="253" class="label">B</text>
  <circle cx="145" cy="442" r="20" class="node"/><text x="138" y="447" class="label">C</text>
  <circle cx="280" cy="466" r="20" class="node"/><text x="273" y="471" class="label">D</text>
  <text x="72" y="526" class="label">6 candidate edges</text>
  <text x="72" y="550" class="small">coordinates do not create 6 animals</text>
  <rect x="72" y="568" width="240" height="24" rx="12" fill="#efeafd"/>
  <text x="91" y="585" class="tiny">CCF · µm · photometry-clock</text>

  <path d="M 350 368 C 374 368, 382 368, 402 368" class="arrow"/>

  <rect x="410" y="124" width="346" height="490" class="card"/>
  <text x="434" y="160" class="step">2 · Preserve edge evidence</text>
  <text x="434" y="184" class="small">each pair has its own joint-valid denominator</text>

  <text x="438" y="226" class="tiny">A—B</text>
  <path d="M 485 220 L 712 220" stroke="#dce4ef" stroke-width="8" stroke-linecap="round"/>
  <path d="M 485 220 L 580 220 M 603 220 L 712 220" stroke="#6c4fd3" stroke-width="5" stroke-linecap="round"/>
  <text x="438" y="264" class="tiny">A—C</text>
  <path d="M 485 258 L 712 258" stroke="#dce4ef" stroke-width="8" stroke-linecap="round"/>
  <path d="M 485 258 L 540 258 M 565 258 L 650 258 M 675 258 L 712 258" stroke="#7b90aa" stroke-width="5" stroke-linecap="round"/>
  <text x="438" y="302" class="tiny">A—D</text>
  <path d="M 485 296 L 712 296" stroke="#dce4ef" stroke-width="8" stroke-linecap="round"/>
  <path d="M 485 296 L 580 296 M 603 296 L 712 296" stroke="#7b90aa" stroke-width="5" stroke-linecap="round"/>
  <text x="438" y="340" class="tiny">B—C</text>
  <path d="M 485 334 L 712 334" stroke="#dce4ef" stroke-width="8" stroke-linecap="round"/>
  <path d="M 485 334 L 540 334 M 565 334 L 650 334 M 675 334 L 712 334" stroke="#7b90aa" stroke-width="5" stroke-linecap="round"/>
  <text x="438" y="378" class="tiny">B—D</text>
  <path d="M 485 372 L 712 372" stroke="#dce4ef" stroke-width="8" stroke-linecap="round"/>
  <path d="M 485 372 L 580 372 M 603 372 L 712 372" stroke="#7b90aa" stroke-width="5" stroke-linecap="round"/>
  <text x="438" y="416" class="tiny">C—D</text>
  <path d="M 485 410 L 712 410" stroke="#dce4ef" stroke-width="8" stroke-linecap="round"/>
  <path d="M 485 410 L 540 410 M 565 410 L 650 410 M 675 410 L 712 410" stroke="#6c4fd3" stroke-width="5" stroke-linecap="round"/>

  <rect x="434" y="452" width="298" height="62" rx="12" fill="#eef6ff" stroke="#cde0f4"/>
  <text x="450" y="476" class="label">Gap-separated pair engine</text>
  <text x="450" y="498" class="small">support · runs · exclusions · provenance</text>
  <rect x="434" y="530" width="142" height="56" rx="12" fill="#f3efff" stroke="#d9cff8"/>
  <text x="449" y="553" class="label">Distance bins</text>
  <text x="449" y="574" class="tiny">local / far</text>
  <rect x="590" y="530" width="142" height="56" rx="12" fill="#fff4e8" stroke="#f0d7b9"/>
  <text x="605" y="553" class="label">Spatial null</text>
  <text x="605" y="574" class="tiny">permute nodes</text>

  <path d="M 766 368 C 790 368, 798 368, 818 368" class="arrow"/>

  <rect x="826" y="124" width="566" height="490" class="card"/>
  <text x="850" y="160" class="step">3 · Infer only after aggregation</text>
  <text x="850" y="184" class="small">dependent edges collapse before mice enter uncertainty</text>

  <text x="856" y="230" class="label">Edges</text>
  <g transform="translate(850,248)">
    <circle cx="10" cy="10" r="6" fill="#6c4fd3"/><circle cx="35" cy="10" r="6" fill="#94a3b8"/>
    <circle cx="60" cy="10" r="6" fill="#94a3b8"/><circle cx="85" cy="10" r="6" fill="#94a3b8"/>
    <circle cx="110" cy="10" r="6" fill="#94a3b8"/><circle cx="135" cy="10" r="6" fill="#6c4fd3"/>
  </g>
  <path d="M 1004 258 L 1050 258" class="arrow"/>
  <text x="1064" y="230" class="label">Session</text>
  <rect x="1056" y="245" width="96" height="28" rx="14" fill="#e8e2fa" stroke="#6c4fd3"/>
  <text x="1074" y="264" class="tiny">one scalar</text>

  <text x="856" y="326" class="label">Repeated sessions</text>
  <rect x="850" y="342" width="78" height="26" rx="13" fill="#e8e2fa"/><rect x="936" y="342" width="78" height="26" rx="13" fill="#e8e2fa"/>
  <rect x="1022" y="342" width="78" height="26" rx="13" fill="#e8e2fa"/>
  <path d="M 1112 355 L 1158 355" class="arrow"/>
  <text x="1170" y="326" class="label">Mouse × condition</text>
  <rect x="1164" y="342" width="184" height="28" rx="14" fill="#dff3ec" stroke="#399478"/>
  <text x="1201" y="361" class="tiny">equal session weight</text>

  <text x="856" y="432" class="label">Mice</text>
  <g transform="translate(850,452)">
    <circle cx="18" cy="18" r="18" fill="#dff3ec" stroke="#399478" stroke-width="2"/><text x="12" y="23" class="tiny">1</text>
    <circle cx="70" cy="18" r="18" fill="#dff3ec" stroke="#399478" stroke-width="2"/><text x="64" y="23" class="tiny">2</text>
    <circle cx="122" cy="18" r="18" fill="#dff3ec" stroke="#399478" stroke-width="2"/><text x="116" y="23" class="tiny">3</text>
    <circle cx="174" cy="18" r="18" fill="#dff3ec" stroke="#399478" stroke-width="2"/><text x="168" y="23" class="tiny">4</text>
  </g>
  <path d="M 1050 470 L 1104 470" class="arrow"/>
  <rect x="1112" y="432" width="236" height="78" rx="14" fill="#eef6ff" stroke="#8cb6df"/>
  <text x="1130" y="458" class="label">Condition B − condition A</text>
  <text x="1130" y="482" class="small">mouse bootstrap + randomization</text>
  <text x="1130" y="501" class="tiny">n = mice, never edges</text>

  <rect x="850" y="542" width="498" height="44" rx="12" fill="#fff4e8" stroke="#f0d7b9"/>
  <text x="870" y="569" class="label">Association ≠ communication, directionality, or causality</text>

  <rect x="48" y="648" width="1344" height="64" rx="16" fill="#17233b"/>
  <text x="72" y="675" style="font: 700 15px ui-sans-serif,system-ui,sans-serif;fill:#ffffff">Three denominators remain visible</text>
  <text x="72" y="698" style="font: 500 13px ui-sans-serif,system-ui,sans-serif;fill:#cdd7e7">temporal support qualifies an edge · edge count describes a session · mouse count determines condition uncertainty</text>
</svg>
