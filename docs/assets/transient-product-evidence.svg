<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Frozen transient thresholds and waveform quality control</title>
  <desc id="description">A separate baseline or negative-control recording produces candidate-scale scores and a frozen channel threshold. An outcome recording passes through its named detector plus that frozen score gate. Every retained candidate then receives a native, gap-bounded waveform cutout and a pass, warning, or fail quality status before optional quantification.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e1b4b" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 26px system-ui,sans-serif;fill:#1e1b4b}.subtitle{font:500 14px system-ui,sans-serif;fill:#64748b}.lane{font:700 13px system-ui,sans-serif;letter-spacing:.09em}.head{font:700 17px system-ui,sans-serif;fill:#0f172a}.body{font:500 13px system-ui,sans-serif;fill:#475569}.tiny{font:700 12px system-ui,sans-serif}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.4;rx:16;filter:url(#shadow)}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#background)"/>
  <text x="54" y="52" class="title">Threshold evidence is frozen before outcome waveforms are judged</text>
  <text x="54" y="78" class="subtitle">Separate source evidence · detector-bound score gate · native gap-bounded cutouts · explicit QC before quantification</text>

  <rect x="42" y="110" width="1116" height="154" rx="22" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="66" y="140" class="lane" fill="#0e7490">CALIBRATION LANE — NO OUTCOME SAMPLES</text>
  <rect x="68" y="159" width="230" height="78" class="box"/>
  <path d="M90 205 C107 188 121 218 138 194 S169 210 187 191 S219 216 271 183" fill="none" stroke="#0891b2" stroke-width="3"/>
  <text x="89" y="183" class="head">Baseline / control source</text>
  <path d="M298 198 H356" class="arrow"/>
  <rect x="359" y="159" width="230" height="78" class="box"/>
  <circle cx="387" cy="202" r="5" fill="#06b6d4"/><circle cx="411" cy="190" r="5" fill="#06b6d4"/><circle cx="435" cy="207" r="5" fill="#06b6d4"/><circle cx="459" cy="182" r="5" fill="#06b6d4"/>
  <text x="486" y="192" class="head">Candidate scores</text><text x="486" y="214" class="body">inside continuity runs</text>
  <path d="M589 198 H647" class="arrow"/>
  <rect x="650" y="159" width="230" height="78" class="box"/>
  <rect x="675" y="181" width="180" height="16" rx="8" fill="#cffafe"/><line x1="813" y1="175" x2="813" y2="211" stroke="#0e7490" stroke-width="4"/>
  <text x="675" y="222" class="body">MAD or empirical quantile</text>
  <path d="M880 198 H938" class="arrow"/>
  <rect x="941" y="159" width="191" height="78" class="box"/>
  <text x="963" y="190" class="head">Frozen threshold</text><text x="963" y="214" class="body">source + spec fingerprint</text>

  <rect x="42" y="286" width="1116" height="210" rx="22" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="66" y="317" class="lane" fill="#7e22ce">OUTCOME LANE — EVERY EXCLUSION AND CUTOUT RETAINED</text>
  <rect x="68" y="341" width="205" height="112" class="box"/>
  <path d="M90 405 C108 402 118 395 131 398 C148 402 154 359 171 402 C188 407 198 390 214 398 C230 404 242 402 251 398" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="90" y="374" class="head">Outcome recording</text>
  <path d="M273 397 H323" class="arrow"/>
  <rect x="326" y="341" width="205" height="112" class="box"/>
  <text x="350" y="373" class="head">Named detector</text><text x="350" y="398" class="body">native family gate</text>
  <rect x="350" y="414" width="157" height="23" rx="11" fill="#ede9fe"/><text x="428" y="430" text-anchor="middle" class="tiny" fill="#6d28d9">+ frozen score gate</text>
  <path d="M531 397 H581" class="arrow"/>
  <rect x="584" y="341" width="205" height="112" class="box"/>
  <line x1="610" y1="420" x2="763" y2="420" stroke="#cbd5e1" stroke-width="4"/><path d="M629 420 C642 420 648 376 661 420" fill="none" stroke="#8b5cf6" stroke-width="3"/><rect x="690" y="376" width="20" height="44" fill="#fecaca"/><path d="M716 420 C729 420 735 383 748 420" fill="none" stroke="#8b5cf6" stroke-width="3"/>
  <text x="608" y="373" class="head">Native cutouts</text><text x="608" y="443" class="body">gaps stop windows</text>
  <path d="M789 397 H839" class="arrow"/>
  <rect x="842" y="341" width="290" height="112" class="box"/>
  <circle cx="880" cy="385" r="17" fill="#22c55e"/><circle cx="927" cy="385" r="17" fill="#f59e0b"/><circle cx="974" cy="385" r="17" fill="#ef4444"/>
  <text x="880" y="389" text-anchor="middle" class="tiny" fill="#fff">P</text><text x="927" y="389" text-anchor="middle" class="tiny" fill="#fff">W</text><text x="974" y="389" text-anchor="middle" class="tiny" fill="#fff">F</text>
  <text x="1005" y="390" class="head">Waveform QC</text><text x="866" y="421" class="body">boundary · rails · flat steps · neighbors</text><text x="866" y="442" class="tiny" fill="#7e22ce">optional gate before kinetics</text>

  <rect x="350" y="515" width="500" height="27" rx="13.5" fill="#1e1b4b"/>
  <text x="600" y="533" text-anchor="middle" class="tiny" fill="#fff">No interpolation · no threshold refitting · no silent candidate deletion</text>
</svg>
