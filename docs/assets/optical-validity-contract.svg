<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Prospective optical mask and observed validity contracts</title>
  <desc id="description">Two independent paths preserve auditability. Declared pulse times generate a fixed exclusion mask. Recorded optical data generate recovery and control diagnostics. A separate path combines a versioned sensor profile with recorded channel identity and observations to generate a pass, warning, or fail assessment. Neither path automatically corrects the fluorescence signal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172554" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 26px system-ui,sans-serif;fill:#172554}.subtitle{font:500 14px system-ui,sans-serif;fill:#475569}.lane{font:700 14px system-ui,sans-serif;letter-spacing:.08em}.head{font:700 17px system-ui,sans-serif;fill:#0f172a}.body{font:500 13px system-ui,sans-serif;fill:#475569}.tiny{font:600 12px system-ui,sans-serif}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:16;filter:url(#shadow)}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <text x="52" y="52" class="title">Optical validity stays auditable when timing and outcomes stay separate</text>
  <text x="52" y="78" class="subtitle">Mask from declared intervention timing · diagnose from observations · constrain interpretation from versioned metadata</text>

  <rect x="42" y="112" width="1116" height="202" rx="22" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="66" y="143" class="lane" fill="#1d4ed8">OPTOGENETIC ARTIFACT CONTRACT</text>
  <rect x="67" y="166" width="230" height="111" class="box"/>
  <circle cx="92" cy="194" r="8" fill="#2563eb"/><circle cx="124" cy="194" r="8" fill="#2563eb"/><circle cx="156" cy="194" r="8" fill="#2563eb"/>
  <text x="88" y="230" class="head">Declared pulse ledger</text>
  <text x="88" y="253" class="body">onset · offset · site · power</text>
  <path d="M297 221 H354" class="arrow"/>
  <rect x="357" y="166" width="230" height="111" class="box"/>
  <rect x="380" y="190" width="184" height="18" rx="9" fill="#dbeafe"/>
  <rect x="429" y="190" width="51" height="18" rx="4" fill="#2563eb"/>
  <text x="380" y="230" class="head">Fixed time-only mask</text>
  <text x="380" y="253" class="body">merged intervals · fingerprint</text>
  <path d="M587 221 H644" class="arrow"/>
  <rect x="647" y="166" width="230" height="111" class="box"/>
  <path d="M671 209 C690 179 710 241 729 199 S768 231 788 203 S827 217 850 194" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="670" y="230" class="head">Observed diagnostics</text>
  <text x="670" y="253" class="body">recovery · rails · control</text>
  <path d="M877 221 H934" class="arrow"/>
  <rect x="937" y="166" width="196" height="111" class="box"/>
  <text x="961" y="205" class="head">Downstream evidence</text>
  <text x="961" y="230" class="body">mask stays unchanged</text>
  <rect x="961" y="244" width="142" height="20" rx="10" fill="#dcfce7"/><text x="1032" y="258" text-anchor="middle" class="tiny" fill="#166534">gaps remain gaps</text>

  <rect x="42" y="334" width="1116" height="202" rx="22" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="66" y="365" class="lane" fill="#7e22ce">SENSOR AND REFERENCE VALIDITY CONTRACT</text>
  <rect x="67" y="388" width="230" height="111" class="box"/>
  <rect x="89" y="409" width="71" height="10" rx="5" fill="#8b5cf6"/><rect x="89" y="428" width="145" height="8" rx="4" fill="#ddd6fe"/><rect x="89" y="445" width="122" height="8" rx="4" fill="#ddd6fe"/>
  <text x="89" y="478" class="head">Versioned profile</text>
  <path d="M297 443 H354" class="arrow"/>
  <rect x="357" y="388" width="230" height="111" class="box"/>
  <circle cx="389" cy="420" r="10" fill="#22c55e"/><circle cx="421" cy="420" r="10" fill="#a855f7"/><path d="M389 420 H421" stroke="#64748b" stroke-width="3"/>
  <text x="380" y="459" class="head">Channels + observations</text>
  <text x="380" y="482" class="body">role · wavelength · validity</text>
  <path d="M587 443 H644" class="arrow"/>
  <rect x="647" y="388" width="230" height="111" class="box"/>
  <text x="671" y="425" class="head">Explicit issue ledger</text>
  <text x="671" y="450" class="body">metadata · signal · reference</text>
  <text x="671" y="478" class="tiny" fill="#7e22ce">no silent correction</text>
  <path d="M877 443 H934" class="arrow"/>
  <rect x="937" y="388" width="196" height="111" class="box"/>
  <circle cx="977" cy="430" r="17" fill="#22c55e"/><circle cx="1028" cy="430" r="17" fill="#f59e0b"/><circle cx="1079" cy="430" r="17" fill="#ef4444"/>
  <text x="977" y="434" text-anchor="middle" class="tiny" fill="#fff">P</text><text x="1028" y="434" text-anchor="middle" class="tiny" fill="#fff">W</text><text x="1079" y="434" text-anchor="middle" class="tiny" fill="#fff">F</text>
  <text x="961" y="478" class="head">Interpretation gate</text>

  <rect x="366" y="556" width="468" height="27" rx="13.5" fill="#172554"/>
  <text x="600" y="574" text-anchor="middle" class="tiny" fill="#fff">Diagnose validity · never claim biological specificity from metadata alone</text>
</svg>
