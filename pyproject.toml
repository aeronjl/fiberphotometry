[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fipha"
version = "0.1.0.dev0"
description = "Auditable fiber photometry analysis in Python: dF/F, peri-event and transient analysis, and NWB provenance from signals to animal-level inference"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{ name = "Aeron Laffere" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "xarray>=2025.1",
]

[project.optional-dependencies]
acquisition = ["h5py>=3.11", "pandas>=2.2", "pyarrow>=18"]
# behavio owns pose, ethograms, interval policies and behavioural covariates.
# fipha genuinely needs it for every behaviour-interop path (including
# fipha.io.ndx_pose and fipha.behavio.BehavioStudyExport.to_study), so it is a
# real dependency of this extra rather than a lazily hoped-for import.
#
# NOTE: behavio is not published on PyPI yet, so the requirement pins a git
# commit. Replace it with an ordinary version constraint (for example
# "behavio>=0.2,<1") at behavio's first release. Until then the pin must be
# advanced whenever behavio gains an interface fipha depends on; the commit
# below carries behavio.pose, behavio.ethograms, behavio.covariates and
# behavio.sync. For local co-development, resolve behavio from a sibling
behavior = ["behavio[readers] @ git+https://github.com/aeronjl/behavio@ce0bcde7225efe2dd297dd02a12dd6fb46485c85"]
plots = ["matplotlib>=3.9"]
nwb = [
    "ndx-fiber-photometry>=0.2.3",
    "ndx-pose>=0.3.0",
    "pynwb>=3.0",
    "remfile>=0.1.13",
]
tdt = ["tdt>=0.7.3"]
stats = ["pandas>=2.2", "statsmodels>=0.14.5"]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "nwbinspector>=0.6",
  "pandas>=2.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-timeout>=2.3",
  "ruff>=0.11",
  "scipy-stubs>=1.14,<1.18",
]
docs = [
    "matplotlib>=3.9",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.29",
]
ibl-validation = ["one-api==3.5.2"]
stats-validation = ["statsmodels>=0.14.5"]

[project.urls]
Repository = "https://github.com/aeronjl/fipha"
Issues = "https://github.com/aeronjl/fipha/issues"

[project.scripts]
fipha = "fipha.cli:main"

# Required only because the `behavior` extra names behavio by git URL. Remove
# together with that pin when behavio reaches PyPI.
[tool.hatch.metadata]
allow-direct-references = true

# fipha and behavio are co-developed. Until behavio is published, resolve it
# from the sibling checkout so `uv run` exercises the two together. Delete this
# table (and the git pin above) once behavio is on PyPI.
[tool.uv.sources]
behavio = { path = "../behavio", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/fipha"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "fipha/schemas"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --timeout=300"
testpaths = ["tests"]
markers = ["integration: opt-in tests requiring public network services"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/fipha/report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fipha"]
