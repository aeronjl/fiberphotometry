      - Public IBL event report: tutorials/ibl-feedback-report.md
      - DANDI NWB robustness analysis: tutorials/dandi-000971-reward-multiverse.md
      - Event-kernel simulation: tutorials/event-kernel-simulation.md
      - Previous-outcome event kernels: tutorials/event-kernel-history.md
      - Variable-duration behavior kernels: tutorials/variable-duration-kernels.md
      - Public event-kernel reanalysis: tutorials/dandi-000971-event-kernel.md
      - Spontaneous-transient sensitivity: tutorials/spontaneous-transients.md
