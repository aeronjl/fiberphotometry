site_name: fipha
site_description: "Auditable fiber photometry analysis in Python: dF/F, peri-event and transient analysis, and NWB provenance from signals to animal-level inference"
site_url: https://aeronjl.github.io/fipha/
repo_url: https://github.com/aeronjl/fipha
repo_name: aeronjl/fipha
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Use light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: warn

# Scientific decision records are a contributor resource. They build so that
# in-repo links resolve, but they are deliberately kept out of the reader-facing
# nav. Any OTHER page missing from the nav is a bug and fails the strict build.
not_in_nav: |
  /decisions/*

nav:
  - Home: index.md
  - Start here:
      - Install: getting-started/install.md
      - Your first dF/F trace: getting-started/first-dff-trace.md
      - Your first peri-event plot: getting-started/first-peri-event-plot.md
      - Choose a workflow: getting-started/index.md
      - First event analysis: product-workflow.md
      - Command line: cli.md
      - Import tabular data: tabular-import.md
      - Import TDT data: tdt-import.md
      - Import native acquisition files: native-acquisition-import.md
  - Methods:
      - Choose a method:
          - Methods map: methods/index.md
          - Capability and gap matrix: methods/capability-matrix.md
          - Public-data evidence atlas: methods/public-evidence-atlas.md
      - Signal formation and validity:
          - Category guide: methods/signal-validity.md
          - Preprocessing and QC: pipeline.md
          - Irregular sampling: irregular-sampling.md
          - Optogenetic artifacts and sensor validity: optical-validity.md
          - Sensor-kinetic modeling: sensor-kinetic-modeling.md
          - Wavelength-aware optical unmixing: optical-unmixing.md
      - Event-locked responses and encoding:
          - Category guide: methods/event-locked.md
          - Peri-event inference: peri-event-inference.md
          - Behavioral event-kernel encoding: event-kernel-encoding.md
          - Event-kernel model multiverses: event-kernel-multiverse.md
          - Predictor-family contributions: predictor-family-contributions.md
          - Event-kernel interval calibration: event-kernel-interval-calibration.md
      - Spontaneous and continuous dynamics:
          - Category guide: methods/continuous-dynamics.md
          - Spontaneous transients: spontaneous-transients.md
          - Time, frequency, and state analysis: spectral-state-analysis.md
          - Multiscale long-duration summaries: multiscale-long-duration.md
      - Multi-signal and spatial analysis:
          - Category guide: methods/multisignal-spatial.md
          - Multi-site and multi-color association: multisite-multicolor-analysis.md
          - Coordinate-aware dense arrays: spatial-network.md
      - Population inference and robustness:
          - Category guide: methods/inference-robustness.md
          - Animal estimates and population contrasts: population-inference.md
          - Group-by-condition animal interactions: population-interactions.md
          - Population inference across core workflows: population-workflow-adapters.md
          - Population inference for frequency and lag curves: population-curve-inference.md
          - Experimental design and inference: inference-design.md
          - Robustness multiverses: multiverse-contract.md
          - Grouped multiverse reports: grouped-multiverse-report.md
          - Scalar mixed models: scalar-mixed-model.md
      - Behavior and longitudinal integration:
          - Category guide: methods/behavior-longitudinal.md
          - Native ndx-pose interoperability: ndx-pose-interoperability.md
          - Across-session comparability: session-comparability.md
          - Longitudinal behavior with Behavio: behavio-interoperability.md
  - Worked examples:
