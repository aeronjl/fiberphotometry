schema_version = "1"
title = "IBL feedback-aligned DMS response"

[contrast]
factor = "feedback"
numerator = "correct"
denominator = "incorrect"

[channel]
name = "DMS"

[preprocessing]
kind = "reference"
method = "irls"
normalization = "divide"

[event_windows]
baseline = [-0.5, 0.0]
response = [0.0, 0.5]

[inference]
intent = "descriptive"
randomized = false
acknowledged_assumptions = [
  "approximately_gaussian_unit_differences",
  "complete_pairs",
  "estimand_matches_question",
  "independent_aggregation_units",
]

[timecourse]
enabled = true
window = [-1.0, 2.0]
rate_hz = 20.0
confidence = 0.95
draws = 500
seed = 7

[quality]
blocking_warnings = []
