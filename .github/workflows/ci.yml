name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run pytest --cov=fiberphotometry --cov-report=term-missing
      - if: matrix.python-version == '3.12'
        run: uv run ruff check . && uv run ruff format --check . && uv run mypy
      - if: matrix.python-version == '3.12'
        run: |
          uv build
          uv venv /tmp/fiberphotometry-wheel
          uv pip install --python /tmp/fiberphotometry-wheel/bin/python dist/*.whl
          /tmp/fiberphotometry-wheel/bin/python -c "import fiberphotometry; print(fiberphotometry.__version__)"
          /tmp/fiberphotometry-wheel/bin/fiberphotometry --help
